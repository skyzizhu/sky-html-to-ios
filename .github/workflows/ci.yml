name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Validate Skill metadata and progressive disclosure
        run: python scripts/validate_skill.py .

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Check whitespace errors
        run: git diff --check

      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
