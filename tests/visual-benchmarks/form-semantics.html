<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form semantics benchmark</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { background: #d8dce3; color: #20242d; }
    .screen { width: min(100vw, 393px); min-height: 100vh; margin: 0 auto; background: #f5f6f8; }
    .status { height: 44px; padding: 12px 20px 0; display: flex; justify-content: space-between; font-size: 14px; font-weight: 650; }
    .nav { height: 58px; padding: 4px 20px 10px; display: flex; align-items: center; justify-content: space-between; }
    .nav h1 { margin: 0; font-size: 24px; }
    .save { border: 0; background: transparent; color: #1769d2; font-size: 15px; font-weight: 650; }
    .content { height: calc(100vh - 102px); overflow-y: auto; padding: 8px 16px 36px; }
    .caption { margin: 16px 4px 8px; color: #747b89; font-size: 12px; font-weight: 650; }
    .group { overflow: hidden; border: 1px solid #e1e4e9; border-radius: 14px; background: white; }
    .field { min-height: 64px; padding: 10px 14px; display: grid; grid-template-columns: 108px minmax(0, 1fr); align-items: center; gap: 12px; border-bottom: 1px solid #eceef2; }
    .field:last-child { border-bottom: 0; }
    .field label, .field .label { font-size: 14px; font-weight: 600; }
    input, textarea, select, .display-field { width: 100%; min-width: 0; border: 1px solid #d7dbe3; border-radius: 9px; background: #fafbfc; color: #2b303a; font: inherit; font-size: 13px; }
    input, select, .display-field { height: 38px; padding: 0 10px; }
    textarea { height: 76px; padding: 9px 10px; resize: none; }
    input:focus, textarea:focus, select:focus { border-color: #1769d2; outline: 2px solid rgba(23, 105, 210, .12); }
    input:disabled { color: #9da3af; background: #f0f1f4; }
    .display-field { display: flex; align-items: center; color: #555d6c; }
    .hint { margin: 8px 4px 0; color: #858c99; font-size: 11px; line-height: 1.5; }
  </style>
</head>
<body>
<main class="screen" data-ios-app-root="true" data-ios-screen="form-semantics" data-ios-screen-initial>
  <div class="status"><span>9:41</span><span>● ◒ ▰</span></div>
  <header class="nav"><h1>资料设置</h1><button class="save">保存</button></header>
  <section class="content" data-ios-scroll-root="vertical">
    <div class="caption">文本输入</div>
    <div class="group">
      <div class="field"><label for="nickname">昵称</label><input id="nickname" name="nickname" type="text" placeholder="请输入昵称" autocomplete="nickname"></div>
      <div class="field"><label for="city">所在城市</label><input id="city" name="city" type="text" list="city-options" placeholder="输入或选择城市"><datalist id="city-options"><option value="beijing">北京</option><option value="shanghai">上海</option><option value="shenzhen" disabled>深圳</option></datalist></div>
      <div class="field"><label for="bio">个人简介</label><textarea id="bio" maxlength="120" placeholder="介绍一下自己">专注于原生产品体验。</textarea></div>
      <div class="field"><label for="account">账号</label><input id="account" type="text" value="sky-2026" readonly></div>
      <div class="field"><label for="tenant">组织编号</label><input id="tenant" type="text" value="CN-001" disabled></div>
    </div>
    <div class="caption">选择与展示</div>
    <div class="group">
      <div class="field"><label for="language">语言</label><select id="language" name="language"><option value="zh-CN" selected>简体中文</option><option value="en">English</option><option value="ja" disabled>日本語</option></select></div>
      <div class="field"><span class="label">员工编号</span><div class="display-field">PM-1024</div></div>
    </div>
    <p class="hint">输入控件、只读状态、禁用状态和展示文字拥有相似外观，但必须保持不同的原生语义。</p>
  </section>
</main>
</body>
</html>
